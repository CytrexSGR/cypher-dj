[package]
name = "baukasten"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
pruef_alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { workspace = true }
baukasten_dsp = { path = "../modular_dsp" }

[dev-dependencies]
serde_json = "1"
