[workspace]
resolver = "2"
members = ["rb_dsp", "rb338", "xtask", "eq_dsp", "eq", "reverb_dsp", "reverb", "reverb_ffi", "comp_dsp", "comp", "sat_dsp", "sat", "modular_dsp", "modular", "labor_dsp", "labor", "remix_dsp"]

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

[profile.release]
lto = "thin"
strip = "symbols"

# The DSP crates and their tests run at opt-level 3 even in `cargo test` (debug assertions and overflow checks stay on): the example
# convention tests render every example graph and took 47 minutes unoptimized (gate run 2026-11-23), the cost tests need optimized code.
[profile.dev.package.baukasten_dsp]
opt-level = 3
[profile.dev.package.rb_dsp]
opt-level = 3
[profile.dev.package.saett_dsp]
opt-level = 3
[profile.dev.package.eq_dsp]
opt-level = 3
[profile.dev.package.hall_dsp]
opt-level = 3
[profile.dev.package.komp_dsp]
opt-level = 3
[profile.dev.package.labor_dsp]
opt-level = 3
[profile.dev.package.remix_dsp]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
