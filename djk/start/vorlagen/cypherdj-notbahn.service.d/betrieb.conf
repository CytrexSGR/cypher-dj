# Betriebs-Drop-in (VORLAGE, nicht installiert) zu djk/units/cypherdj-notbahn.service.
# Die Notbahn sitzt daneben an denselben Zielen wie der Kern (ADR 016 Nachtrag 2026-09-25) und hängt mit --vor am
# Kern-Eingang notbahn_vor, damit der Graph sie vor dem Kern rechnet (29.10.; vorher --kante, Kern zuerst). Restart, Nice und StartLimit kommen aus der Unit.
# Platzhalter: @MASTER@, @CUE_ARG@, @TON_FREI@ wie beim Kern; @KERN_CLIENT@ JACK-Name des Kerns (cypherdj-kern,
# in einer Prüfinstanz cypherdj-kern-<i>).
[Service]
ExecStart=
ExecStart=/usr/bin/pw-jack -p 256 %h/cypher-dj/djk/notbahn/build/cypherdj-notbahn --master @MASTER@ @CUE_ARG@ --daneben --vor @KERN_CLIENT@:notbahn_vor @TON_FREI@
