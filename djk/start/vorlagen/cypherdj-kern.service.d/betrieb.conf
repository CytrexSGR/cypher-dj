# Betriebs-Drop-in (VORLAGE, nicht installiert) zu djk/units/cypherdj-kern.service.
# Abgeleitet von djk/start/djk-start: genau diese Zeile setzt djk-start für die transiente Kern-Unit ein, nachdem es
# die Platzhalter gefüllt hat. Alle anderen Eigenschaften (Type=notify, Watchdog 200 ms, Restart, Timeouts) kommen
# unverändert aus der Unit von Scheibe 18.
# Platzhalter: @MASTER@ JACK-Präfix des Master-Ziels (Vorgabe cypher_stumm:playback_F), @CUE_ARG@ "--cue <präfix>"
# oder leer, @TON_FREI@ "--ton-frei" oder leer (nur nach Andreas' Freigabe, SCHNITTSTELLEN §8), @KERN_ARGS@ weitere
# Aufrufparameter (etwa --konfig <datei>, --pruefmodus bis Scheibe 35 hand_osc liefert).
# Installieren (erst wenn Andreas den Verbund einschaltet, ROADMAP §8.11): gefüllt nach
# ~/.config/systemd/user/cypherdj-kern.service.d/betrieb.conf; djk-start --vorlagen-nach DIR füllt sie, ohne zu installieren.
[Service]
ExecStart=
ExecStart=/usr/bin/pw-jack -p 256 %h/cypher-dj/djk/kern/build/cypherdj-kern --master @MASTER@ @CUE_ARG@ @TON_FREI@ --waechter-ms 100 @KERN_ARGS@
