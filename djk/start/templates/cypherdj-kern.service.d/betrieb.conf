# Operations drop-in (TEMPLATE, not installed) for djk/units/cypherdj-kern.service.
# Derived from djk/start/djk-start: exactly this line is what djk-start sets for the transient kern unit after filling in
# the placeholders. All other properties (Type=notify, watchdog 200 ms, restart, timeouts) come unchanged from the unit of slice 18.
# Placeholders: @MASTER@ JACK prefix of the master target (default cypher_stumm:playback_F), @CUE_ARG@ "--cue <prefix>"
# or empty, @TON_FREI@ "--ton-frei" or empty (only after Andreas' approval, INTERFACES §8), @KERN_ARGS@ further
# call parameters (e.g. --konfig <file>, --pruefmodus until slice 35 delivers hand_osc). @KERN_CPUS@ CPU list of the kern
# (multi-core spec 2026-11-06: djk-start computes the CPUs with cores.py, default CYPHERDJ_KERN_KERNE = 4 physical cores, 0-3 8-11 on the dev box; demucs gets the rest; before that fixed 0 1 8 9).
# Install (only once Andreas switches the setup on, ROADMAP §8.11): filled in to
# ~/.config/systemd/user/cypherdj-kern.service.d/betrieb.conf; djk-start --vorlagen-nach DIR fills it in without installing.
[Service]
CPUAffinity=@KERN_CPUS@
ExecStart=
ExecStart=/usr/bin/pw-jack -p 256 %h/cypher-dj/djk/core/build/cypherdj-kern --master @MASTER@ @CUE_ARG@ @TON_FREI@ --waechter-ms 100 @KERN_ARGS@
