# Scheibe 18, Fehlerfall der Querprobe über den Chaos-Prüfstand aus Scheibe 16 (djk/pruefstand/pruefstand.py): dessen eigenes Messgerät
# (Klick-Einsätze am Ziel, Raster nach Rückkehr, fehlende Klicks) gegen den Kern mit Neustart-Zustand.
# Aufruf: python3 djk/pruefstand/pruefstand.py lauf djk/kern/tests/neustart/profile/kill-neustart.toml --ordner <dir>
# Notbahn daneben mit Kante (Vorgabe von 16 seit dem 2026-09-26), Kern mit --master an die Senke (setzt 16 selbst).
# Vorher /dev/shm/cypherdj-a/zustand löschen: 16 löscht nur den Ring (Plan-Befund B2).
name = "kill-neustart-08"
zweck = "Scheibe 18, Fehlerfall zur Querprobe: derselbe Ablauf mit dem Kern aus 08 (ohne Zustand, ohne sd_notify): systemd startet ihn neu, er beginnt bei Beat 0 ohne Klick."
dauer_s = 40.0
instanz = "a"

[quelle]
art = "kern"
programm = "kern/build/cypherdj-kern-08"
argumente = ["--konfig", "{ordner}/kern.toml"]
neustart = true
eigenschaften = []

[[eingriff]]
nach_s = 10.0
art = "kill9"
ziel = "quelle"

[[eingriff]]
nach_s = 20.5
art = "kill9"
ziel = "quelle"

[[eingriff]]
nach_s = 30.25
art = "kill9"
ziel = "quelle"

[erwartung]
fehlende_klicks_max = 0
raster_versatz_max = 1.0
schleife_in_jedem_eingriff = true
notbahn_uebernahmen_min = 3
