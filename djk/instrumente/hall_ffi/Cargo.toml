[package]
name = "hall_ffi"
version = "0.1.0"
edition = "2021"
description = "Cypher-Effekte und -Instrumente mit C-ABI als statische Bibliothek für den djk-Kern: Hall (fx/2), Kompressor (je Kanal), RB-338 (Arrangement), Baukasten-Graphen (Erzeuger-Ströme)"
license = "GPL-3.0-or-later"
publish = false

[features]
# Fault injection for the catch_unwind tests (tests/eq_ffi.rs). Measured: `cargo build --release -p hall_ffi --all-targets`
# (and `--workspace --all-targets`) unifies this feature into the static library (nm: cypher_eq_vergifte present);
# the CMake call `cargo build --release -p hall_ffi` (kern/CMakeLists.txt:79) does not, and neither does
# `cargo test --release -p hall_ffi --no-run` (it writes no libhall_ffi.a at all). Raw nm: messungen/2026-11-02-s4-rack/T9/feature_leck_nm.txt.
# Do not build the library for the core with --all-targets.
fehlerinjektion = []

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hall_dsp = { path = "../hall_dsp" }
komp_dsp = { path = "../komp_dsp" }
rb_dsp = { path = "../rb_dsp" }
baukasten_dsp = { path = "../baukasten_dsp" }
eq_dsp = { path = "../eq_dsp" }
saett_dsp = { path = "../saett_dsp" }

# Nur für die Tests: die Parameterschicht der RB-FFI gegen das Plugin (tests/rb_wie_plugin.rs). Nicht in der Staticlib.
[dev-dependencies]
hall_ffi = { path = ".", features = ["fehlerinjektion"] }
rb338 = { path = "../rb338" }
nih_plug = { workspace = true }
