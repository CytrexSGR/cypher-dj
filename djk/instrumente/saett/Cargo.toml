[package]
name = "cypher_saett"
version = "0.1.0"
edition = "2021"
description = "Cypher Saett als VST3 (nih-plug): dünne Hülle um saett_dsp"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
saett_dsp = { path = "../saett_dsp" }
nih_plug = { workspace = true }

[features]
pruef_alloc = ["nih_plug/assert_process_allocs"]
